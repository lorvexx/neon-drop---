name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm install
      - name: Prepare web files
        run: npm run prepare-web
      - name: Add Android platform
        run: npx cap add android
      - name: Generate icons and splash
        continue-on-error: true
        run: |
          mkdir -p assets
          cp icon-only.png icon-foreground.png icon-background.png assets/
          cp splash.png assets/splash.png
          cp splash.png assets/splash-dark.png
          npx capacitor-assets generate --android --iconBackgroundColor "#040806" --iconBackgroundColorDark "#040806" --splashBackgroundColor "#040806" --splashBackgroundColorDark "#040806"
      - name: Sync
        run: npx cap sync android
      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: neondrop-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
